name: Publish

# Source on master, generated site on gh-pages — that is where Pages serves from.
# tools/deploy.sh does the actual work for every stage below, so the local and CI
# paths cannot drift; CI just calls the stages one at a time so that a failure is
# attributable from the public steps API.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash tools/deploy.sh build

      - name: Check links
        run: bash tools/deploy.sh check

      - name: Push gh-pages
        run: bash tools/deploy.sh publish
